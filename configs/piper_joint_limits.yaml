warning: >-
  The CAN responses confirm current controller parameter values, not the
  mechanical safe travel envelope. Keep software motion limits at the
  intersection of the SDK nominal ranges and CAN angle ranges. AgileX support
  clarifies the 0x473 speed readback scale as 0.01 rad/s per raw unit; raw 300
  therefore reads 3 rad/s, matching the displayed UI value. This does not
  measure actual motion speed, and the runtime must not write maximum-speed
  parameters. Keep acceleration readback (0.001) and setter (0.01) scales
  separate and unresolved; do not write acceleration parameters. Gripper mm
  scale remains nominal. No motion authorization is implied by this readback.
